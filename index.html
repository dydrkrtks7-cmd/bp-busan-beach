 <style>
 /* RESET & BASE */
 :root {
 --bg: #000000;
 --fg: #ffffff;
 --accent: #ff3b00;
 --border: 4px;
 --space-unit: 24px;
 --font-main: 'Impact', 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;

 * { box-sizing: border-box; margin: 0; padding: 0; }
 
 html {

 body {
 background-color: var(--bg);
 color: var(--fg);
 font-family: var(--font-body);

 h1, h2, h3 {
 font-family: var(--font-main);
 text-transform: uppercase;
 letter-spacing: -1px;
 line-height: 0.9;

 h1 {
 font-size: clamp(4rem, 15vw, 12rem);
 color: var(--fg);
 position: relative;
 z-index: 2;
 }

 h2 {
 font-size: clamp(2rem, 8vw, 6rem);
 margin-bottom: 2rem;
 border-bottom: 2px solid var(--accent);
 display: inline-block;
 }

 p {
 font-size: 1.2rem;
 margin-bottom: 1.5rem;
 max-width: 70ch;
 }

 /* UTILS */
 .highlight { color: var(--accent); }
 .raw-border { border: var(--border) solid var(--fg); }
 .accent-border { border: var(--border) solid var(--accent); }
 .flex-center { display: flex; align-items: center; justify-content: center; }
 
 /* LAYOUT COMPONENTS */
 .container {
 max-width: 1440px;
 margin: 0 auto;
 padding: 0 var(--space-unit);
 }

 /* HEADER */
 header {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 z-index: 100;
 background: var(--bg);
 border-bottom: var(--border) solid var(--fg);
 padding: 1rem 2rem;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 .logo {
 font-family: var(--font-main);
 font-size: 2rem;
 font-weight: bold;
 }

 .menu-toggle {
 background: var(--accent);
 color: var(--bg);
 border: none;
 padding: 10px 20px;
 font-family: var(--font-main);
 font-size: 1.2rem;
 cursor: pointer;
 text-transform: uppercase;
 }

 nav {
 position: fixed;
 top: 0;
 right: -100%;
 width: 300px;
 height: 100vh;
 background: var(--accent);
 color: var(--bg);
 border-left: var(--border) solid var(--fg);
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 transition: right 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
 z-index: 99;
 }

 nav.active { right: 0; }

 nav ul li {
 margin: 2rem 0;
 }

 nav ul li a {
 font-family: var(--font-main);
 font-size: 2rem;
 text-transform: uppercase;
 }

 /* HERO SECTION */
 .hero {
 height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 position: relative;
 padding-top: 80px;
 overflow: hidden;
 }

 .hero::before {
 content: '';
 position: absolute;
 top: 20%;
 left: 10%;
 width: 60%;
 height: 60%;
 border: 4px solid var(--accent);
 z-index: 1;
 transform: rotate(-5deg);
 }

 .hero-content {
 z-index: 10;
 text-align: center;
 background: var(--bg);
 padding: 2rem;
 border: 4px solid var(--fg);
 max-width: 90%;
 }

 .hero-subtitle {
 display: block;
 font-size: 1.5rem;
 color: var(--accent);
 margin-bottom: 1rem;
 font-weight: bold;
 }

 /* DATA SECTION (Asymmetric) */
 .section-data {
 padding: 120px 0;
 display: grid;
 grid-template-columns: 1fr 2fr;
 gap: 4rem;
 background: var(--fg);
 color: var(--bg);
 position: relative;
 }

 .data-sticky {
 position: sticky;
 top: 100px;
 height: fit-content;
 border: 4px solid var(--bg);
 padding: 2rem;
 }

 .data-grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
 gap: 2rem;
 }

 .data-card {
 border: 4px solid var(--bg);
 padding: 2rem;
 background: #fff;
 box-shadow: 20px 20px 0px var(--accent);
 transition: transform 0.2s;
 }

 .data-card:hover {
 transform: translate(-10px, -10px);
 box-shadow: 30px 30px 0px var(--bg);
 }

 .data-card h3 {
 font-size: 2rem;
 margin-bottom: 1rem;
 border-bottom: 4px solid var(--accent);
 }

 /* REVIEW SECTION */
 .reviews {
 padding: 120px 2rem;
 background: var(--bg);
 }

 .review-scroller {
 display: flex;
 gap: 2rem;
 overflow-x: auto;
 padding-bottom: 2rem;
 }

 .review-card {
 min-width: 350px;
 border: 2px solid var(--accent);
 padding: 2rem;
 background: #111;
 position: relative;
 }

 .review-card::after {
 content: '';
 position: absolute;
 bottom: -10px;
 right: -10px;
 width: 50px;
 height: 50px;
 background: var(--accent);
 z-index: 0;
 }

 .stars { color: var(--accent); font-size: 1.5rem; }
 
 .user-info {
 display: flex;
 justify-content: space-between;
 margin-bottom: 1rem;
 border-bottom: 1px solid #333;
 padding-bottom: 0.5rem;
 font-family: var(--font-main);
 font-size: 1.2rem;
 }

 footer {

 padding: 4rem 2rem;
 text-align: center;
 background: var(--bg);
 color: var(--fg);
 }

 .footer-logo {
 font-family: var(--font-main);
 font-size: 3rem;
 margin-bottom: 1rem;
 display: block;
 }

 grid-template-columns: 1fr;
 padding: 60px 0;

 top: 0;

 h1 { font-size: 4rem; }
 h2 { font-size: 2.5rem; }
